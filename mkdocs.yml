site_name: Chapman Integrations API
site_description: Documentação da API GraphQL de integração com o Sage X3 (Chapman Integrations API)
site_author: José Roberto Ferreira (GS Consulting)
repo_url: https://github.com/joserobertoferreira/api-graphql-x3-chapman
repo_name: api-graphql-x3-chapman
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para tema claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Módulos:
      - Visão geral: modules/index.md
      - Plataforma e segurança:
          - Autenticação (auth): modules/auth.md
          - Configuração e utilitários (common): modules/common.md
      - Dados mestres:
          - Utilizadores (users): modules/users.md
          - Parceiros de negócio (business-partners): modules/business-partners.md
          - Clientes (customers): modules/customers.md
          - Fornecedores (suppliers): modules/suppliers.md
          - Empresas (companies): modules/companies.md
          - Estabelecimentos (sites): modules/sites.md
          - Moradas (addresses): modules/addresses.md
          - Produtos (products): modules/products.md
          - Categorias de clientes: modules/customer-categories.md
          - Categorias de fornecedores: modules/supplier-categories.md
          - Categorias de produtos: modules/product-categories.md
          - Dimensões (dimensions): modules/dimensions.md
          - Tipos de dimensão (dimension-types): modules/dimension-types.md
          - Condições de pagamento (payment-terms): modules/payment-terms.md
          - Taxas de câmbio (currency-rate): modules/currency-rate.md
      - Vendas:
          - Encomendas de venda (sales-order): modules/sales-order.md
      - Compras:
          - Encomendas de compra (purchase-order): modules/purchase-order.md
          - Faturas de compra (purchase-invoice): modules/purchase-invoice.md
          - Faturas de compra personalizadas (custom-purchase-invoice): modules/custom-purchase-invoice.md
          - Faturas de fornecedor (supplier-invoice): modules/supplier-invoice.md
      - Financeiro:
          - Contabilidade (financials): modules/financials.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joserobertoferreira/api-graphql-x3-chapman

copyright: Copyright &copy; GS Consulting
